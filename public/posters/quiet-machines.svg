<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="gallery" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="50%" stop-color="#0a1a15"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
    <filter id="artglow">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- Gallery background -->
  <rect width="400" height="600" fill="url(#gallery)"/>
  <!-- Gallery wall suggestion -->
  <rect x="30" y="100" width="340" height="350" fill="#0a1510" opacity="0.5" rx="2"/>
  <!-- Artwork frames on wall -->
  <!-- Frame 1 - abstract -->
  <g transform="translate(55,130)">
    <rect width="120" height="90" fill="#0a1510" stroke="#2a5540" stroke-width="1.5" opacity="0.8"/>
    <!-- Abstract art inside -->
    <circle cx="40" cy="45" r="25" fill="#22aa66" opacity="0.2"/>
    <circle cx="80" cy="35" r="20" fill="#33cc88" opacity="0.15"/>
    <rect x="30" y="50" width="60" height="3" fill="#44ddaa" opacity="0.2"/>
    <!-- Spotlight -->
    <rect x="40" y="-20" width="40" height="3" fill="#44ddaa" opacity="0.1" filter="url(#glow)"/>
  </g>
  <!-- Frame 2 - geometric -->
  <g transform="translate(225,120)">
    <rect width="100" height="110" fill="#0a1510" stroke="#2a5540" stroke-width="1.5" opacity="0.8"/>
    <polygon points="50,20 80,80 20,80" fill="none" stroke="#22aa66" stroke-width="1" opacity="0.3"/>
    <circle cx="50" cy="55" r="18" fill="none" stroke="#33cc88" stroke-width="0.8" opacity="0.25"/>
    <rect x="30" y="-20" width="40" height="3" fill="#44ddaa" opacity="0.1" filter="url(#glow)"/>
  </g>
  <!-- Frame 3 - landscape -->
  <g transform="translate(70,270)">
    <rect width="260" height="120" fill="#0a1510" stroke="#2a5540" stroke-width="1.5" opacity="0.8"/>
    <!-- Landscape art -->
    <rect x="0" y="60" width="260" height="60" fill="#114422" opacity="0.3"/>
    <circle cx="200" cy="40" r="15" fill="#33cc88" opacity="0.15"/>
    <path d="M0,80 Q65,40 130,70 Q195,50 260,80" fill="none" stroke="#22aa66" stroke-width="1" opacity="0.2"/>
    <rect x="90" y="-20" width="80" height="3" fill="#44ddaa" opacity="0.1" filter="url(#glow)"/>
  </g>
  <!-- Gallery floor -->
  <rect x="30" y="450" width="340" height="2" fill="#2a5540" opacity="0.2"/>
  <!-- Gallery spotlights from ceiling -->
  <g opacity="0.04">
    <polygon points="115,95 80,130 150,130" fill="#44ddaa"/>
    <polygon points="275,95 245,120 305,120" fill="#44ddaa"/>
    <polygon points="200,95 140,270 260,270" fill="#44ddaa"/>
  </g>
  <!-- Human figure observing -->
  <g fill="#0a1510" opacity="0.6" transform="translate(170,460)">
    <circle cx="10" cy="0" r="6"/>
    <rect x="5" y="6" width="10" height="20" rx="2"/>
    <rect x="1" y="10" width="5" height="12" rx="1"/>
    <rect x="14" y="10" width="5" height="12" rx="1"/>
    <rect x="5" y="26" width="5" height="14" rx="1"/>
    <rect x="10" y="26" width="5" height="14" rx="1"/>
  </g>
  <!-- Robot/AI figure creating -->
  <g fill="#0a1510" opacity="0.6" transform="translate(250,462)">
    <rect x="3" y="0" width="14" height="10" rx="3" stroke="#22aa66" stroke-width="0.5"/>
    <circle cx="7" cy="4" r="1.5" fill="#22aa66" opacity="0.5"/>
    <circle cx="13" cy="4" r="1.5" fill="#22aa66" opacity="0.5"/>
    <rect x="5" y="10" width="10" height="18" rx="1"/>
    <rect x="0" y="12" width="5" height="10" rx="1"/>
    <rect x="15" y="12" width="5" height="10" rx="1"/>
    <rect x="5" y="28" width="5" height="12" rx="1"/>
    <rect x="10" y="28" width="5" height="12" rx="1"/>
  </g>
  <!-- Documentary camera lens motif -->
  <g stroke="#22aa66" fill="none" opacity="0.08" transform="translate(200,540)">
    <circle r="25"/>
    <circle r="18"/>
    <circle r="10"/>
    <circle r="4" fill="#22aa66" opacity="0.2"/>
  </g>
  <!-- Ambient particles -->
  <g fill="#33cc88" opacity="0.1">
    <circle cx="50" cy="500" r="1"/>
    <circle cx="350" cy="510" r="1.2"/>
    <circle cx="100" cy="540" r="0.8"/>
    <circle cx="300" cy="550" r="1"/>
  </g>
</svg>
