<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a1e"/>
      <stop offset="50%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#1a0515"/>
    </linearGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="smallglow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="600" fill="url(#bg)"/>
  <!-- Ambient pink/purple glow -->
  <ellipse cx="200" cy="250" rx="200" ry="150" fill="#cc3399" opacity="0.06" filter="url(#softglow)"/>
  <ellipse cx="150" cy="350" rx="120" ry="80" fill="#6633cc" opacity="0.05" filter="url(#softglow)"/>
  <!-- Grid pattern - virtual world -->
  <g stroke="#cc3399" stroke-width="0.3" opacity="0.1">
    <line x1="0" y1="350" x2="400" y2="350"/>
    <line x1="0" y1="380" x2="400" y2="380"/>
    <line x1="0" y1="415" x2="400" y2="415"/>
    <line x1="0" y1="455" x2="400" y2="455"/>
    <line x1="0" y1="500" x2="400" y2="500"/>
    <line x1="0" y1="550" x2="400" y2="550"/>
    <!-- Perspective lines -->
    <line x1="200" y1="350" x2="0" y2="600"/>
    <line x1="200" y1="350" x2="400" y2="600"/>
    <line x1="200" y1="350" x2="50" y2="600"/>
    <line x1="200" y1="350" x2="350" y2="600"/>
    <line x1="200" y1="350" x2="100" y2="600"/>
    <line x1="200" y1="350" x2="300" y2="600"/>
    <line x1="200" y1="350" x2="150" y2="600"/>
    <line x1="200" y1="350" x2="250" y2="600"/>
  </g>
  <!-- Pixel heart left -->
  <g fill="#cc3399" opacity="0.5" transform="translate(100,180) scale(2)">
    <rect x="2" y="0" width="4" height="4"/>
    <rect x="8" y="0" width="4" height="4"/>
    <rect x="0" y="4" width="16" height="4"/>
    <rect x="0" y="8" width="16" height="4"/>
    <rect x="2" y="12" width="12" height="4"/>
    <rect x="4" y="16" width="8" height="4"/>
    <rect x="6" y="20" width="4" height="4"/>
  </g>
  <!-- Pixel heart right -->
  <g fill="#9933cc" opacity="0.5" transform="translate(240,160) scale(2)">
    <rect x="2" y="0" width="4" height="4"/>
    <rect x="8" y="0" width="4" height="4"/>
    <rect x="0" y="4" width="16" height="4"/>
    <rect x="0" y="8" width="16" height="4"/>
    <rect x="2" y="12" width="12" height="4"/>
    <rect x="4" y="16" width="8" height="4"/>
    <rect x="6" y="20" width="4" height="4"/>
  </g>
  <!-- Connection line between hearts -->
  <line x1="135" y1="220" x2="265" y2="200" stroke="#cc3399" stroke-width="1" opacity="0.2" stroke-dasharray="6,4"/>
  <!-- Floating pixels -->
  <g fill="#cc3399" opacity="0.3">
    <rect x="60" y="100" width="6" height="6"/>
    <rect x="320" y="120" width="4" height="4"/>
    <rect x="180" y="80" width="5" height="5"/>
    <rect x="40" y="280" width="4" height="4"/>
    <rect x="350" y="300" width="6" height="6"/>
    <rect x="280" y="260" width="3" height="3"/>
  </g>
  <g fill="#9933cc" opacity="0.25">
    <rect x="90" y="140" width="4" height="4"/>
    <rect x="300" y="80" width="5" height="5"/>
    <rect x="150" y="300" width="4" height="4"/>
    <rect x="250" y="320" width="3" height="3"/>
  </g>
  <!-- Horizon glow -->
  <rect x="0" y="348" width="400" height="4" fill="#cc3399" opacity="0.15" filter="url(#smallglow)"/>
</svg>
