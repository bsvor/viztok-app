<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="dreamsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="50%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#15082a"/>
    </linearGradient>
    <filter id="dreamglow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <!-- Dream sky background -->
  <rect width="400" height="600" fill="url(#dreamsky)"/>
  <!-- Ethereal glow -->
  <ellipse cx="200" cy="300" rx="200" ry="180" fill="#7733cc" opacity="0.05" filter="url(#dreamglow)"/>
  <ellipse cx="150" cy="200" rx="100" ry="80" fill="#9944ff" opacity="0.04" filter="url(#dreamglow)"/>
  <!-- Floating dream city - impossible architecture -->
  <g transform="translate(0,50)" opacity="0.7">
    <!-- Floating island base -->
    <ellipse cx="200" cy="400" rx="140" ry="25" fill="#1a0a2e" opacity="0.6"/>
    <!-- Towers -->
    <g fill="#150825" stroke="#7733aa" stroke-width="0.5" opacity="0.8">
      <rect x="120" y="250" width="25" height="150" rx="2"/>
      <rect x="155" y="220" width="20" height="180" rx="2"/>
      <rect x="185" y="200" width="30" height="200" rx="2"/>
      <rect x="225" y="230" width="22" height="170" rx="2"/>
      <rect x="255" y="260" width="25" height="140" rx="2"/>
    </g>
    <!-- Spires -->
    <g fill="#7733aa" opacity="0.4">
      <polygon points="132,250 128,220 136,220"/>
      <polygon points="165,220 162,185 168,185"/>
      <polygon points="200,200 196,160 204,160"/>
      <polygon points="236,230 233,200 239,200"/>
      <polygon points="267,260 264,235 270,235"/>
    </g>
    <!-- Glowing windows -->
    <g fill="#9955ff" opacity="0.4">
      <rect x="128" y="270" width="4" height="6"/>
      <rect x="133" y="300" width="4" height="6"/>
      <rect x="128" y="340" width="4" height="6"/>
      <rect x="162" y="240" width="4" height="6"/>
      <rect x="162" y="280" width="4" height="6"/>
      <rect x="162" y="330" width="4" height="6"/>
      <rect x="193" y="220" width="5" height="7"/>
      <rect x="202" y="260" width="5" height="7"/>
      <rect x="193" y="310" width="5" height="7"/>
      <rect x="202" y="350" width="5" height="7"/>
      <rect x="232" y="250" width="4" height="6"/>
      <rect x="237" y="290" width="4" height="6"/>
      <rect x="263" y="280" width="4" height="6"/>
      <rect x="268" y="320" width="4" height="6"/>
    </g>
    <!-- Bridges between towers -->
    <g stroke="#7733aa" stroke-width="0.8" opacity="0.3" fill="none">
      <path d="M145,300 Q155,295 175,300"/>
      <path d="M215,280 Q225,275 247,280"/>
    </g>
  </g>
  <!-- Dream particles / sleepers being pulled -->
  <g fill="#bb88ff" opacity="0.25">
    <circle cx="60" cy="450" r="2"/>
    <circle cx="80" cy="480" r="1.5"/>
    <circle cx="340" cy="440" r="2"/>
    <circle cx="320" cy="470" r="1.5"/>
    <circle cx="50" cy="350" r="1"/>
    <circle cx="350" cy="360" r="1.2"/>
  </g>
  <!-- Upward pull lines -->
  <g stroke="#7733aa" stroke-width="0.5" opacity="0.1" stroke-dasharray="3,6">
    <line x1="60" y1="450" x2="150" y2="380"/>
    <line x1="340" y1="440" x2="250" y2="370"/>
    <line x1="80" y1="480" x2="170" y2="400"/>
    <line x1="320" y1="470" x2="240" y2="390"/>
  </g>
  <!-- Blueprint grid overlay -->
  <g stroke="#5522aa" stroke-width="0.2" opacity="0.06">
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="450" x2="400" y2="450"/>
  </g>
  <!-- Stars above -->
  <g fill="white" opacity="0.4">
    <circle cx="50" cy="40" r="1"/>
    <circle cx="150" cy="60" r="0.8"/>
    <circle cx="280" cy="30" r="1.2"/>
    <circle cx="350" cy="80" r="0.8"/>
    <circle cx="100" cy="100" r="0.6"/>
    <circle cx="320" cy="120" r="0.7"/>
  </g>
</svg>
