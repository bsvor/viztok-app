<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="35%" stop-color="#331a00"/>
      <stop offset="55%" stop-color="#cc5500"/>
      <stop offset="65%" stop-color="#ff6600"/>
      <stop offset="75%" stop-color="#cc5500"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="dustglow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <!-- Sunset sky -->
  <rect width="400" height="600" fill="url(#sunset)"/>
  <!-- Sun disk -->
  <circle cx="200" cy="340" r="60" fill="#ff6600" opacity="0.3"/>
  <circle cx="200" cy="340" r="40" fill="#ff8800" opacity="0.4"/>
  <circle cx="200" cy="340" r="60" fill="#ff6600" opacity="0.1" filter="url(#glow)"/>
  <!-- Horizontal scan lines over sun (retro) -->
  <g stroke="#0D1B2A" stroke-width="1" opacity="0.15">
    <line x1="140" y1="310" x2="260" y2="310"/>
    <line x1="140" y1="320" x2="260" y2="320"/>
    <line x1="140" y1="330" x2="260" y2="330"/>
    <line x1="140" y1="340" x2="260" y2="340"/>
    <line x1="140" y1="350" x2="260" y2="350"/>
    <line x1="140" y1="360" x2="260" y2="360"/>
    <line x1="140" y1="370" x2="260" y2="370"/>
  </g>
  <!-- Desert horizon -->
  <rect x="0" y="380" width="400" height="220" fill="#1a0d00" opacity="0.85"/>
  <!-- Desert dunes -->
  <path d="M0,400 Q100,370 200,390 Q300,410 400,380 L400,420 Q300,430 200,410 Q100,390 0,420Z" fill="#261500" opacity="0.6"/>
  <!-- Dust haze -->
  <ellipse cx="200" cy="380" rx="250" ry="30" fill="#cc5500" opacity="0.05" filter="url(#dustglow)"/>
  <!-- Road/path receding -->
  <g fill="#1a0d00" opacity="0.4">
    <polygon points="180,600 220,600 205,390 195,390"/>
  </g>
  <g stroke="#cc5500" stroke-width="0.5" opacity="0.15" stroke-dasharray="8,12">
    <line x1="200" y1="390" x2="200" y2="600"/>
  </g>
  <!-- Android figure silhouette (distant, on road) -->
  <g fill="#0a0500" opacity="0.8" transform="translate(193,370)">
    <circle cx="7" cy="0" r="4"/>
    <rect x="4" y="4" width="6" height="12" rx="1"/>
    <rect x="1" y="6" width="3" height="8" rx="1"/>
    <rect x="10" y="6" width="3" height="8" rx="1"/>
    <rect x="4" y="16" width="3" height="6" rx="1"/>
    <rect x="7" y="16" width="3" height="6" rx="1"/>
  </g>
  <!-- Rogue machine silhouettes on horizon -->
  <g fill="#0a0500" opacity="0.4">
    <!-- Machine 1 -->
    <rect x="50" y="370" width="15" height="20" rx="2"/>
    <rect x="52" y="360" width="4" height="12"/>
    <rect x="60" y="362" width="3" height="10"/>
    <!-- Machine 2 -->
    <rect x="320" y="365" width="20" height="25" rx="2"/>
    <circle cx="330" cy="362" r="5"/>
    <!-- Machine 3 -->
    <rect x="360" y="372" width="12" height="16" rx="1"/>
  </g>
  <!-- Chrome/metal reflections -->
  <g stroke="#ffaa44" stroke-width="0.5" opacity="0.15">
    <line x1="193" y1="375" x2="190" y2="385"/>
    <line x1="207" y1="375" x2="210" y2="385"/>
  </g>
  <!-- Dust particles -->
  <g fill="#cc7733" opacity="0.15">
    <circle cx="80" cy="360" r="1.5"/>
    <circle cx="300" cy="350" r="1"/>
    <circle cx="150" cy="370" r="1.2"/>
    <circle cx="250" cy="365" r="1"/>
    <circle cx="40" cy="390" r="1.5"/>
    <circle cx="350" cy="395" r="1.3"/>
  </g>
</svg>
