<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1500"/>
      <stop offset="50%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </linearGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="600" fill="url(#bg)"/>
  <!-- Warm amber glow -->
  <ellipse cx="200" cy="220" rx="180" ry="120" fill="#cc8800" opacity="0.06" filter="url(#softglow)"/>
  <!-- Timeline branches - diverging paths -->
  <g stroke="#cc8800" fill="none" opacity="0.25" stroke-width="1.5">
    <!-- Central trunk -->
    <line x1="200" y1="100" x2="200" y2="250"/>
    <!-- Branch 1 - left -->
    <path d="M200,250 Q170,300 120,380" stroke-dasharray="none"/>
    <!-- Branch 2 - right -->
    <path d="M200,250 Q230,300 280,380" stroke-dasharray="none"/>
    <!-- Branch 3 - center-left -->
    <path d="M200,250 Q190,320 160,430" stroke-dasharray="4,4" opacity="0.15"/>
    <!-- Branch 4 - center-right -->
    <path d="M200,250 Q210,320 240,430" stroke-dasharray="4,4" opacity="0.15"/>
  </g>
  <!-- Divergence point -->
  <circle cx="200" cy="250" r="6" fill="#cc8800" opacity="0.5"/>
  <circle cx="200" cy="250" r="12" fill="#cc8800" opacity="0.15" filter="url(#glow)"/>
  <!-- Holographic message nodes -->
  <g opacity="0.5">
    <!-- Node 1 - top -->
    <circle cx="200" cy="120" r="8" fill="none" stroke="#cc8800" stroke-width="1" opacity="0.4"/>
    <circle cx="200" cy="120" r="3" fill="#cc8800" opacity="0.6"/>
    <!-- Node 2 - left branch end -->
    <circle cx="120" cy="380" r="8" fill="none" stroke="#cc8800" stroke-width="1" opacity="0.4"/>
    <circle cx="120" cy="380" r="3" fill="#cc8800" opacity="0.6"/>
    <!-- Node 3 - right branch end -->
    <circle cx="280" cy="380" r="8" fill="none" stroke="#cc8800" stroke-width="1" opacity="0.4"/>
    <circle cx="280" cy="380" r="3" fill="#cc8800" opacity="0.6"/>
  </g>
  <!-- Family silhouettes at nodes -->
  <g fill="#1a1200" opacity="0.7">
    <!-- Parent figures at top -->
    <circle cx="192" cy="155" r="5"/>
    <rect x="189" y="160" width="6" height="14" rx="2"/>
    <circle cx="208" cy="155" r="5"/>
    <rect x="205" y="160" width="6" height="14" rx="2"/>
    <!-- Figure at left -->
    <circle cx="115" cy="415" r="4"/>
    <rect x="112" y="419" width="6" height="12" rx="2"/>
    <!-- Figure at right -->
    <circle cx="275" cy="415" r="4"/>
    <rect x="272" y="419" width="6" height="12" rx="2"/>
  </g>
  <!-- Warning signals / contradiction marks -->
  <g fill="#cc3300" opacity="0.2" font-family="sans-serif" font-size="20" font-weight="bold">
    <text x="95" y="350">!</text>
    <text x="270" y="350">!</text>
  </g>
  <!-- Time particles -->
  <g fill="#cc8800" opacity="0.2">
    <circle cx="60" cy="200" r="1.5"/>
    <circle cx="340" cy="180" r="1"/>
    <circle cx="100" cy="300" r="1.2"/>
    <circle cx="300" cy="310" r="1.5"/>
    <circle cx="50" cy="450" r="1"/>
    <circle cx="350" cy="440" r="1.3"/>
    <circle cx="170" cy="480" r="1"/>
    <circle cx="230" cy="500" r="1.2"/>
  </g>
  <!-- Clock fragments -->
  <g stroke="#cc8800" fill="none" opacity="0.08" stroke-width="1">
    <circle cx="200" cy="250" r="60"/>
    <!-- Hour marks -->
    <line x1="200" y1="195" x2="200" y2="200"/>
    <line x1="200" y1="300" x2="200" y2="305"/>
    <line x1="255" y1="250" x2="260" y2="250"/>
    <line x1="140" y1="250" x2="145" y2="250"/>
  </g>
</svg>
