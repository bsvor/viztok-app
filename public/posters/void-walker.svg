<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <radialGradient id="void" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="40%" stop-color="#0a0a20"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </radialGradient>
    <radialGradient id="doorlight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4444cc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4444cc" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="bigglow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="600" fill="url(#void)"/>
  <!-- Void glow -->
  <circle cx="200" cy="260" r="100" fill="url(#doorlight)" filter="url(#bigglow)"/>
  <!-- The Door -->
  <g transform="translate(150,160)">
    <!-- Door frame -->
    <rect x="0" y="0" width="100" height="200" fill="none" stroke="#4444aa" stroke-width="2" opacity="0.5"/>
    <!-- Inner glow -->
    <rect x="5" y="5" width="90" height="190" fill="#1a1a44" opacity="0.6"/>
    <!-- Light from within -->
    <rect x="10" y="10" width="80" height="180" fill="#2222aa" opacity="0.15"/>
    <!-- Bright center -->
    <ellipse cx="50" cy="100" rx="25" ry="50" fill="#4444cc" opacity="0.15" filter="url(#glow)"/>
    <!-- Door handle -->
    <circle cx="80" cy="105" r="4" fill="none" stroke="#6666cc" stroke-width="1.5" opacity="0.6"/>
  </g>
  <!-- Dimensional fracture lines -->
  <g stroke="#4444aa" stroke-width="0.5" opacity="0.2">
    <line x1="150" y1="160" x2="80" y2="80"/>
    <line x1="250" y1="160" x2="320" y2="80"/>
    <line x1="150" y1="360" x2="60" y2="500"/>
    <line x1="250" y1="360" x2="340" y2="500"/>
    <line x1="200" y1="160" x2="200" y2="60"/>
    <line x1="200" y1="360" x2="200" y2="480"/>
  </g>
  <!-- Equation/journal fragments -->
  <g fill="#4444aa" opacity="0.12" font-family="monospace" font-size="8">
    <text x="20" y="440">∂ψ/∂t = iℏ∇²ψ</text>
    <text x="280" y="460">dim(V) = ∞</text>
    <text x="30" y="500">the door opens</text>
    <text x="270" y="520">between here</text>
    <text x="60" y="540">and nowhere</text>
  </g>
  <!-- Floating particles being pulled toward door -->
  <g fill="#6666cc" opacity="0.4">
    <circle cx="100" cy="200" r="2"/>
    <circle cx="300" cy="230" r="1.5"/>
    <circle cx="80" cy="320" r="1"/>
    <circle cx="320" cy="300" r="1.8"/>
    <circle cx="130" cy="140" r="1.2"/>
    <circle cx="270" cy="150" r="1"/>
    <circle cx="90" cy="260" r="1.5"/>
    <circle cx="310" cy="270" r="1.3"/>
  </g>
  <!-- Subtle distortion rings around door -->
  <g stroke="#3333aa" fill="none" opacity="0.08" transform="translate(200,260)">
    <ellipse rx="70" ry="120" stroke-width="1"/>
    <ellipse rx="90" ry="150" stroke-width="0.8"/>
    <ellipse rx="115" ry="185" stroke-width="0.5"/>
  </g>
</svg>
